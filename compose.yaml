name: annachillbeauty

services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-annachill}
      POSTGRES_USER: ${DB_USER:-annachill}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-annachill_dev}
      TZ: Asia/Ho_Chi_Minh
      PGTZ: Asia/Ho_Chi_Minh
    volumes:
      - ./data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${DB_PORT_FORWARD:-5432}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - internal

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-annachill}
      DB_USER: ${DB_USER:-annachill}
      DB_PASSWORD: ${DB_PASSWORD:-annachill_dev}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      AUTH_SESSION_HOURS: ${AUTH_SESSION_HOURS:-12}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-300}
      LOGIN_RATE_LIMIT_PER_15_MINUTES: ${LOGIN_RATE_LIMIT_PER_15_MINUTES:-10}
      ATTENDANCE_QR_SECRET: ${ATTENDANCE_QR_SECRET:-change-this-attendance-secret-in-development}
      STORE_NAME: ${STORE_NAME:-AnnaChill Beauty}
      ADMIN_NAME: ${ADMIN_NAME:-Quản trị hệ thống}
      VIETQR_BANK_BIN: ${VIETQR_BANK_BIN:-ICB}
      VIETQR_ACCOUNT_NUMBER: ${VIETQR_ACCOUNT_NUMBER:-108868686868}
      VIETQR_ACCOUNT_NAME: ${VIETQR_ACCOUNT_NAME:-ANNA CHILL BEAUTY}
      TZ: Asia/Ho_Chi_Minh
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    networks:
      - internal

networks:
  internal:
    driver: bridge
