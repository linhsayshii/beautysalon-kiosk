name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches the Dockerfiles and backend/package.json engines.
  NODE_VERSION: '24'
  # Production containers run in this zone and the date-bucketing tests assume it; runners default to UTC.
  TZ: Asia/Ho_Chi_Minh
  COMPOSE: docker compose -f compose.yaml -f compose.ci.yaml

jobs:
  frontend:
    name: Frontend (typecheck, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Includes src/styles/styles.contract.test.ts (design-system guard rails).
      - run: npm run test
      - run: npm run build

  backend:
    name: Backend (syntax check, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # node --check on every file, then node --test (PGlite integration tests, seed tests).
      - run: npm run check

  smoke:
    name: Full-stack smoke (Docker Compose)
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: $COMPOSE build api frontend

      - name: Seed Anna and start the stack
        run: |
          $COMPOSE up -d --wait --wait-timeout 90 database
          $COMPOSE exec -T database sh -c 'exec psql -X -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' \
            < database/seeds/anna_seed.sql
          $COMPOSE up -d --wait --wait-timeout 120 api frontend

      - name: API smoke test (Anna)
        run: $COMPOSE exec -T api env SMOKE_SEED=anna node --input-type=module < scripts/ci-smoke.mjs

      - name: Nginx serves the SPA and proxies the API
        run: |
          $COMPOSE exec -T frontend wget -q -O - http://127.0.0.1/ | grep '<div id="root"' >/dev/null
          $COMPOSE exec -T frontend wget -q -O - http://127.0.0.1/api/v1/ready | grep '"ready"' >/dev/null

      - name: Reset database and seed Minji
        run: |
          $COMPOSE down -v
          $COMPOSE up -d --wait --wait-timeout 90 database
          $COMPOSE exec -T database sh -c 'exec psql -X -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' \
            < database/seeds/minji_seed.sql
          $COMPOSE up -d --wait --wait-timeout 120 api

      - name: API smoke test (Minji)
        run: $COMPOSE exec -T api env SMOKE_SEED=minji node --input-type=module < scripts/ci-smoke.mjs

      - name: Dump logs on failure
        if: failure()
        run: $COMPOSE logs --no-color --tail=200

      - name: Cleanup
        if: always()
        run: $COMPOSE down -v
