                    customerName: posCustomer.name,
                    phone: posCustomer.phone || 'N/A',
                    items: [...posCart],

                    discount: posDiscount,

                    change: Math.max(0, (posReceived || finalSum) - finalSum),
                    date: new Date().toISOString().replace('T', ' ').slice(0, 16),
                    paymentMethod: posPaymentMethod

                setPrintedInvoice(invoice);

                                                            // Tính ngày hiện tại trong tuần mẫu
                                                            const formattedDate = `2026-07-2${dayIdx - 1}`;
                                                            // Lấy lịch hẹn khớp với ngày và giờ tương ứng
                                                            const matchAppts = appointments.filter(appt => appt.date === formattedDate && appt.time.startsWith(hourSlot.slice(0, 3)));

                                                            return (
                                                                <div key={dayIdx} className="border-r border-slate-100 p-1.5 relative overflow-y-auto custom-scrollbar space-y-1">
                                                                    {matchAppts.map(appt => (
                                                                        <div key={appt.id} className={`p-1.5 rounded border text-[10px] shadow-sm leading-snug cursor-pointer transition hover:opacity-95 ${appt.color || 'bg-slate-100 border-slate-200'}`}>
                                                                            <div className="font-extrabold truncate flex justify-between items-center">
                                                                                <span>{appt.customerName}</span>
                                                                                {appt.status === "Đang phục vụ" && (
                                                                                    <span className="w-1.5 h-1.5 bg-rose-500 rounded-full animate-ping"></span>
                                                                                )}
                                                                            </div>
                                                                            <div className="text-[9px] mt-0.5 truncate text-slate-500">{services.find(s => s.id === appt.serviceId)?.name}</div>
                                                                            <div className="text-[9px] font-semibold text-slate-400 mt-1">{appt.time} ({appt.duration}p)</div>
                                                                        </div>
                                                                    ))}
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* TAB 1.3: HÓA ĐƠN & KHÁCH HÀNG */}
                                {adminTab === 'history' && (
                                    <div className="bg-white rounded-xl border border-slate-200/60 shadow-sm p-4">
                                        <h3 className="font-bold text-slate-800 text-sm mb-4">Lịch Sử Giao Dịch Hóa Đơn</h3>
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-left border-collapse text-xs">
                                                <thead>
                                                    <tr className="bg-slate-50 border-b border-slate-200 text-slate-500 font-bold">
                                                        <th className="p-3">Mã hóa đơn</th>
                                                        <th className="p-3">Khách hàng</th>
                                                        <th className="p-3">Hình thức</th>
                                                        <th className="p-3">Ngày thanh toán</th>
                                                        <th className="p-3 text-right">Tổng thanh toán</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-100">
                                                    {invoices.map(inv => (
                                                        <tr key={inv.id} className="hover:bg-slate-50/40">
                                                            <td className="p-3 font-bold text-kiot-blue">{inv.id}</td>
                                                            <td className="p-3 font-bold text-slate-700">{inv.customerName}</td>
                                                            <td className="p-3"><span className="px-2 py-0.5 rounded bg-slate-100 text-slate-600 font-semibold">{inv.paymentMethod}</span></td>
                                                            <td className="p-3 text-slate-500">{inv.date}</td>
                                                            <td className="p-3 text-right font-extrabold text-slate-800">{inv.total.toLocaleString('vi-VN')} đ</td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                )}

                                {/* TAB 1.4: HÀNG HÓA */}
                                {adminTab === 'menu' && (
                                    <div className="grid lg:grid-cols-3 gap-5">
                                        <div className="lg:col-span-2 bg-white rounded-xl border border-slate-200/60 shadow-sm p-4">
                                            <h3 className="font-bold text-slate-800 text-sm mb-4">Danh Mục Dịch Vụ</h3>
                                            <div className="space-y-2">
                                                {services.map(s => (
                                                    <div key={s.id} className="flex justify-between items-center border-b pb-2 text-xs">
                                                        <div>
                                                            <span className="font-bold text-slate-700 block">{s.name}</span>
                                                            <span className="text-slate-400 text-[10px]">Thời lượng: {s.duration} phút | {s.category}</span>
                                                        </div>
                                                        <span className="font-extrabold text-kiot-blue">{s.price.toLocaleString('vi-VN')} đ</span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                        <div className="bg-white rounded-xl border border-slate-200/60 shadow-sm p-4">
                                            <h3 className="font-bold text-slate-800 text-sm mb-4">Danh Mục Sản Phẩm (Bán lẻ)</h3>
                                            <div className="space-y-2">
                                                {products.map(p => (
                                                    <div key={p.id} className="flex justify-between items-center border-b pb-2 text-xs">
                                                        <div>
                                                            <span className="font-bold text-slate-700 block">{p.name}</span>
                                                            <span className="text-slate-400 text-[10px]">Tồn kho: {p.stock} sản phẩm</span>
                                                        </div>
                                                        <span className="font-extrabold text-kiot-green">{p.price.toLocaleString('vi-VN')} đ</span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* MODULE 2: GIAO DIỆN THU NGÂN POS */}
                    {currentModule === 'pos' && (
                        <div className="flex flex-grow overflow-hidden h-[calc(100vh-44px)] select-none">
                            {/* Cột trái: Sơ đồ giường/ghế của Thu ngân */}
                            <div className="w-56 bg-white border-r border-slate-200 flex flex-col flex-shrink-0">
                                <div className="p-3 bg-slate-50 border-b border-slate-200 font-bold text-slate-700 flex items-center gap-1.5 text-xs">
                                    <i data-lucide="layout-grid" className="w-4 h-4"></i> Ghế & Giường làm việc
                                </div>
                                <div className="p-3 space-y-2 flex-grow overflow-y-auto custom-scrollbar">
                                    {rooms.map(room => (
                                        <div key={room.id} className="p-3 rounded-lg border border-slate-200/60 bg-slate-50 hover:bg-slate-100/50 cursor-pointer transition">
                                            <div className="flex justify-between items-center mb-1">
                                                <span className="font-bold text-slate-700 text-xs">{room.name}</span>
                                                <span className="w-2.5 h-2.5 rounded-full bg-green-400"></span>
                                            </div>
                                            <span className="text-[10px] text-slate-400 uppercase font-semibold">{room.type === 'hair' ? 'Cắt tóc' : 'Spa'}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Cột giữa: Menu bán hàng */}
                            <div className="flex-grow bg-slate-50 flex flex-col overflow-hidden">
                                <div className="p-3 bg-white border-b border-slate-200 flex items-center justify-between">
                                    <div className="relative w-80">
                                        <input type="text" placeholder="Gõ tên dịch vụ/sản phẩm hoặc mã..." className="w-full pl-8 pr-3 py-1.5 border border-slate-200 rounded-lg text-xs" />
                                        <i data-lucide="search" className="w-3.5 h-3.5 absolute left-2.5 top-2.5 text-slate-400"></i>
                                    </div>
                                </div>

                                <div className="flex-grow p-4 overflow-y-auto custom-scrollbar grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-4">
                                    {services.map(s => (
                                        <div key={s.id} onClick={() => addToPosCart(s)} className="bg-white p-3 rounded-xl border border-slate-200 hover:border-kiot-blue hover:shadow-sm transition cursor-pointer flex flex-col justify-between">
                                            <div>
                                                <span className="text-[9px] bg-blue-50 text-blue-600 px-2 py-0.5 rounded font-bold uppercase">{s.category}</span>
                                                <h4 className="font-bold text-slate-800 text-xs mt-1.5 min-h-[32px] line-clamp-2">{s.name}</h4>
                                            </div>
                                            <div className="text-right mt-2">
                                                <span className="font-extrabold text-kiot-blue text-xs">{s.price.toLocaleString('vi-VN')} đ</span>
                                            </div>
                                        </div>
                                    ))}
                                    {products.map(p => (
                                        <div key={p.id} onClick={() => addToPosCart(p)} className="bg-white p-3 rounded-xl border border-slate-200 hover:border-kiot-green hover:shadow-sm transition cursor-pointer flex flex-col justify-between">
                                            <div>
                                                <span className="text-[9px] bg-green-50 text-green-600 px-2 py-0.5 rounded font-bold uppercase">Sản phẩm</span>
                                                <h4 className="font-bold text-slate-800 text-xs mt-1.5 min-h-[32px] line-clamp-2">{p.name}</h4>
                                            </div>
                                            <div className="flex justify-between items-baseline mt-2">
                                                <span className="text-[9px] text-slate-400">Kho: {p.stock}</span>
                                                <span className="font-extrabold text-kiot-green text-xs">{p.price.toLocaleString('vi-VN')} đ</span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Cột phải: Thanh toán hóa đơn */}
                            <div className="w-[380px] bg-white border-l border-slate-200 flex flex-col justify-between">
                                <div>
                                    <div className="p-3 border-b border-slate-200 bg-slate-50 font-bold text-xs text-slate-700">Chi tiết hóa đơn</div>
                                    <div className="divide-y divide-slate-100 overflow-y-auto max-h-[300px] custom-scrollbar">
                                        {posCart.map(item => (
                                            <div key={item.id} className="p-3 flex justify-between items-center gap-3">
                                                <div>
                                                    <h5 className="font-bold text-slate-700 text-xs">{item.name}</h5>
                                                    <span className="text-[10px] text-slate-400">Đơn giá: {item.price.toLocaleString('vi-VN')} đ</span>
                                                </div>
                                                <div className="flex items-center gap-1.5">
                                                    <span className="font-bold text-xs text-slate-700 bg-slate-100 px-2 py-0.5 rounded">{item.qty}</span>
                                                    <span className="font-extrabold text-slate-800 text-xs">{(item.price * item.qty).toLocaleString('vi-VN')} đ</span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className="p-4 bg-slate-50 border-t border-slate-200 space-y-3">
                                    <div className="flex justify-between text-xs">
                                        <span>Khách cần trả</span>
                                        <span className="font-extrabold text-kiot-blue">{posCart.reduce((sum, i) => sum + (i.price * i.qty), 0).toLocaleString('vi-VN')} đ</span>
                                    </div>
                                    <button onClick={processPosPayment} className="w-full py-2.5 bg-kiot-blue hover:bg-kiot-blueDark text-white text-xs font-bold uppercase rounded-lg transition shadow-md">Thanh Toán (F9)</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        setTimeout(() => {
            if (window.lucide) {
                window.lucide.createIcons();
            }
        }, 1000);
    </script>
</body>
</html>
